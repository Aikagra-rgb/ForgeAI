[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forgeai"
version = "0.1.0"
description = "ForgeAI: Autonomous agent factory with grounded evals and targeted critic-optimizer loop"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "pymupdf>=1.24.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "rich>=13.8.0",
    "streamlit>=1.38.0",
]

[project.scripts]
forgeai = "forgeai.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

